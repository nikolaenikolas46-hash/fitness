<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goxer | Профессиональный Тренер</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root { --primary: #ff416c; --secondary: #4caf50; --xp-color: #00d2ff; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0c29;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px; border-radius: 30px;
            text-align: center; width: min(100%, 412px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .xp-container {
            width: 100%; height: 10px; background: #333;
            border-radius: 5px; margin: 15px 0; overflow: hidden;
        }
        #xp-bar {
            width: 0%; height: 100%; background: var(--xp-color);
            transition: width 0.5s ease; box-shadow: 0 0 10px var(--xp-color);
        }

        #avatar { font-size: 70px; min-height: 90px; display: flex; justify-content: center; align-items: center; }
        #timer { font-size: 3.5rem; font-weight: bold; margin: 10px 0; color: #ffeb3b; }
        
        button {
            background: linear-gradient(45deg, var(--primary), #ff4b2b);
            color: white; border: none; padding: 15px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            width: 100%; font-size: 1.1rem; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
        button:disabled { background: #444; opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        .rank-badge {
            background: var(--xp-color); color: #000;
            padding: 5px 15px; border-radius: 20px;
            font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; display: inline-block;
        }

        .diet-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px; padding: 20px;
            width: min(100%, 392px); margin-top: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        #instruction {
            font-size: 0.85rem;
            color: #ccc;
            margin-top: 10px;
            min-height: 3em;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="rank" class="rank-badge">РАНГ: ЗАГРУЗКА...</div>
        <div id="avatar">⚡</div>
        <h1>Goxer</h1>
        
        <div id="xp-progress" class="xp-container" role="progressbar" aria-label="Опыт до следующего уровня" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="xp-bar"></div></div>
        <p id="task" aria-live="polite" aria-atomic="true" style="font-size: 1.2rem; margin: 10px 0;">Готов стать сильнее?</p>
        
        <div id="timer">00</div>
        <button id="mainBtn" onclick="startWorkout()">СТАРТ</button>
        
        <div id="instruction">Нажми кнопку, чтобы получить задание</div>
        
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 20px;">
            Рекорд за сессию: <span id="sessionCounter">0</span> | Рекорд: <span id="bestRecord">0</span> | XP: <span id="xpText">0</span>
        </p>
    </div>

    <div class="diet-card">
        <h3 style="color: #ffeb3b; margin: 0 0 10px 0;">🥗 Питание на текущий час</h3>
        <div id="dietContent">Загрузка рациона...</div>
    </div>

    <script>
        let sessionCount = 0;
        let xp = parseInt(localStorage.getItem('goxerXP')) || 0;
        let best = parseInt(localStorage.getItem('goxerBest')) || 0;

        const btn = document.getElementById('mainBtn');
        const timerDisplay = document.getElementById('timer');
        const taskDisplay = document.getElementById('task');
        const avatar = document.getElementById('avatar');
        const instructionDisplay = document.getElementById('instruction');

        function playSound(freq, duration) {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, context.currentTime);
            osc.connect(gain);
            gain.connect(context.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + duration);
            osc.stop(context.currentTime + duration);
        }

        function updateUI() {
            document.getElementById('bestRecord').innerText = best;
            document.getElementById('xpText').innerText = xp;
            document.getElementById('sessionCounter').innerText = sessionCount;
            
            let level = Math.floor(xp / 100) + 1;
            document.getElementById('rank').innerText = `РАНГ: ${level} УРОВЕНЬ`;
            
            let progress = xp % 100;
            document.getElementById('xp-bar').style.width = progress + "%";
            document.getElementById('xp-progress').setAttribute('aria-valuenow', progress);
        }

        function runTimer(sec, callback) {
            btn.disabled = true;
            let timeLeft = sec;
            timerDisplay.innerText = timeLeft;
            
            let interval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = (timeLeft < 10 ? "0" : "") + timeLeft;

                if (timeLeft > 0 && timeLeft <= 3) {
                    playSound(440, 0.1);
                }

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    playSound(880, 0.5);
                    callback();
                }
            }, 1000);
        }

        function startWorkout() {
            const exercises = [
                { 
                    name: "Отжимания", 
                    icon: "💪", 
                    time: 15, 
                    hint: "Держи спину ровно, не прогибай поясницу." 
                },
                { 
                    name: "Приседания", 
                    icon: "🏋️", 
                    time: 20, 
                    hint: "Пятки не отрывай от пола, колени смотрят в стороны." 
                },
                { 
                    name: "Джампинг Джек", 
                    icon: "✨", 
                    time: 20, 
                    hint: "Прыгай мягко на носочках, хлопай руками над головой." 
                },
                { 
                    name: "Планка", 
                    icon: "⏱️", 
                    time: 30, 
                    hint: "Тело — одна прямая линия. Напряги пресс!" 
                }
            ];
            const ex = exercises[Math.floor(Math.random() * exercises.length)];
            
            taskDisplay.innerHTML = `Делай: <strong>${ex.name}</strong>`;
            avatar.innerText = ex.icon;
            instructionDisplay.innerText = ex.hint;
            timerDisplay.style.color = "#ffeb3b";
            btn.innerText = "ТРЕНИРОВКА";
            
            runTimer(ex.time, () => {
                xp += 25;
                sessionCount++;
                if (sessionCount > best) {
                    best = sessionCount;
                    localStorage.setItem('goxerBest', best);
                }
                localStorage.setItem('goxerXP', xp);
                updateUI();
                startRest();
            });
        }

        function startRest() {
            taskDisplay.innerHTML = "<strong>ОТДЫХ</strong>";
            avatar.innerText = "🍵";
            instructionDisplay.innerText = "Глубоко дыши через нос, выдыхай через рот.";
            timerDisplay.style.color = "#4caf50";
            btn.innerText = "ОТДЫХ";
            
            runTimer(20, () => {
                timerDisplay.style.color = "#ffeb3b";
                btn.disabled = false;
                btn.innerText = "СЛЕДУЮЩИЙ ПОДХОД";
                taskDisplay.innerHTML = "Отдохнул? Погнали дальше!";
                avatar.innerText = "🔥";
                instructionDisplay.innerText = "Нажми кнопку, когда будешь готов.";
            });
        }

        function updateDiet() {
            const h = new Date().getHours();
            let text = "";
            if (h >= 5 && h < 11) text = "🍳 Завтрак: Овсяная каша с орехами + 2 яйца. Энергия на утро.";
            else if (h >= 11 && h < 17) text = "🍖 Обед: Гречка или рис + куриное филе + свежие овощи.";
            else if (h >= 17 && h < 22) text = "🥛 Ужин: Творог или запеченная рыба. Легкий белок для мышц.";
            else text = "💤 Ночь: Лучшее для мышц сейчас — это крепкий сон 8 часов.";
            document.getElementById('dietContent').innerText = text;
        }

        updateUI();
        updateDiet();
    </script>
</body>
</html>
